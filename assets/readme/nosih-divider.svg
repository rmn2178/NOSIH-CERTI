<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" fill="none">
  <defs>
    <linearGradient id="baseLine" x1="0" y1="12" x2="1200" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#888888" stop-opacity="0"/>
      <stop offset="25%" stop-color="#888888" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#888888" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#888888" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CCCCCC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CCCCCC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11.25" width="1200" height="1.5" fill="url(#baseLine)"/>
  <rect x="-200" y="10.25" width="200" height="3.5" rx="2" fill="url(#beam)">
    <animate attributeName="x" from="-200" to="1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="596" y="8" width="8" height="8" rx="1.5" transform="rotate(45 600 12)" fill="#888888">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>