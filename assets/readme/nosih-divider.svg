<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" fill="none">
  <defs>
    <linearGradient id="baseLine" x1="0" y1="13" x2="1200" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6E7681" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6E7681" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3D8B6E" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#6E7681" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6E7681" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FD3B6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8FD3B6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8FD3B6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="12" width="1200" height="1.5" fill="url(#baseLine)"/>
  <rect x="-180" y="11" width="180" height="3.5" rx="2" fill="url(#beam)">
    <animate attributeName="x" from="-180" to="1200" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="13" r="3.5" fill="#8FD3B6">
    <animate attributeName="r" values="2.8;4.5;2.8" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>